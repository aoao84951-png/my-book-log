<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: transparent; font-family: sans-serif; }
        .card { width: 280px; height: 280px; background: white; border-radius: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; border: 1px solid #eee; overflow: hidden; }
        .search-input { width: 100%; border: 1px solid #f0f0f0; padding: 12px; border-radius: 12px; outline: none; box-sizing: border-box; margin-bottom: 10px; font-size: 14px; background: #fafafa; }
        .res-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; }
        .res-item { display: flex; align-items: center; gap: 12px; padding: 10px 5px; border-bottom: 1px solid #f9f9f9; cursor: pointer; }
        .res-item img { width: 35px; height: 50px; border-radius: 4px; object-fit: cover; }
        .res-item div { font-size: 13px; color: #333; overflow: hidden; }
        .res-item b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #status { font-size: 12px; color: #999; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <input type="text" class="search-input" id="q" placeholder="책 제목 입력 후 엔터..." autocomplete="off">
        <div id="status"></div>
        <ul id="list" class="res-list"></ul>
    </div>
    <script>
        document.getElementById('q').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const q = e.target.value;
                if(!q) return;
                document.getElementById('status').innerText = "검색 중...";
                document.getElementById('list').innerHTML = "";
                
                try {
                    const res = await fetch(`/api/search?query=${encodeURIComponent(q)}`);
                    const books = await res.json();
                    if(books.length === 0) {
                        document.getElementById('status').innerText = "검색 결과가 없습니다.";
                    } else {
                        document.getElementById('status').innerText = "";
                        document.getElementById('list').innerHTML = books.map(b => `
                            <li class="res-item" onclick="saveBook('${b.title.replace(/'/g,"")}','${b.author.replace(/'/g,"")}','${b.cover}')">
                                <img src="${b.cover}"> <div><b>${b.title}</b><small>${b.author}</small></div>
                            </li>`).join('');
                    }
                } catch (err) {
                    document.getElementById('status').innerText = "에러 발생!";
                }
            }
        });

        async function saveBook(t, a, c) {
            if(!confirm('노션에 저장할까요?')) return;
            const res = await fetch('/api/notion', { method: 'POST', body: JSON.stringify({title:t, author:a, cover:c}) });
            if(res.ok) alert('성공!'); else alert('실패!');
        }
    </script>
</body>
</html>
