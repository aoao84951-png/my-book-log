<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: transparent; font-family: -apple-system, sans-serif; }
        .widget-card { width: 300px; height: 300px; background: white; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; border: 1px solid #f0f0f0; overflow: hidden; }
        .header-title { position: absolute; top: 15px; left: 20px; font-size: 11px; color: #6C9AC4; font-weight: 700; letter-spacing: 0.5px; }
        .time { font-size: 42px; font-weight: 300; color: #333; margin-top: -10px; }
        .date { font-size: 13px; color: #bbb; text-transform: uppercase; margin-bottom: 25px; letter-spacing: 1px; }
        .search-trigger { background: #F5F5F5; border: none; padding: 10px 22px; border-radius: 12px; color: #777; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .search-trigger:hover { background: #eee; }
        
        #overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; flex-direction: column; padding: 15px; box-sizing: border-box; z-index: 10; }
        .search-input { width: 100%; border: 1px solid #eee; padding: 10px; border-radius: 10px; outline: none; margin-bottom: 10px; font-size: 14px; }
        .res-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; width: 100%; }
        .res-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid #f9f9f9; cursor: pointer; font-size: 12px; }
        .res-item img { width: 30px; height: 42px; border-radius: 3px; object-fit: cover; }
        .back-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: #ccc; margin-bottom: 5px; align-self: flex-start; }
    </style>
</head>
<body>
    <div class="widget-card">
        <div class="header-title">📖 READING FLOW</div>
        <div id="main-ui" style="text-align: center;">
            <div class="time" id="clock">00:00</div>
            <div class="date" id="date">TUE, APR 21</div>
            <button class="search-trigger" onclick="toggleSearch(true)">🔍 search</button>
        </div>

        <div id="overlay">
            <button class="back-btn" onclick="toggleSearch(false)">←</button>
            <input type="text" class="search-input" id="q" placeholder="책 제목 입력 후 엔터...">
            <ul id="list" class="res-list"></ul>
        </div>
    </div>

    <script>
        function toggleSearch(show) { 
            document.getElementById('overlay').style.display = show ? 'flex' : 'none';
            if(show) document.getElementById('q').focus();
        }

        document.getElementById('q').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const res = await fetch(`/api/search?query=${encodeURIComponent(e.target.value)}`);
                const books = await res.json();
                document.getElementById('list').innerHTML = books.map(b => 
                    `<li class="res-item" onclick="save('${b.title.replace(/'/g,"")}','${b.author.replace(/'/g,"")}','${b.cover}')">
                        <img src="${b.cover}"> <div><b>${b.title}</b><br><small>${b.author}</small></div>
                    </li>`).join('');
            }
        });

        async function save(t, a, c) {
            if(!confirm(`'${t}'을(를) 저장할까요?`)) return;
            const res = await fetch('/api/notion', { method: 'POST', body: JSON.stringify({title:t, author:a, cover:c}) });
            if(res.ok) { alert('완료!'); toggleSearch(false); }
            else { alert('실패! 노션 연결을 확인하세요.'); }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'2-digit'}).toUpperCase();
        }
        setInterval(updateClock, 1000); updateClock();
    </script>
</body>
</html>
