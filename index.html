<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Book Search</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .widget-card { width: 280px; height: 280px; background: white; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; border: 1px solid #f0f0f0; }
        .header { position: absolute; top: 15px; left: 20px; font-size: 12px; color: #999; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .time { font-size: 42px; font-weight: 300; color: #333; margin-top: -10px; }
        .date { font-size: 14px; color: #bbb; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 30px; }
        .search-btn { background: #f5f5f5; border: none; padding: 10px 25px; border-radius: 12px; color: #777; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: all 0.2s; font-size: 15px; }
        .search-btn:hover { background: #eee; color: #333; }
        /* 검색 모달 스타일 */
        #search-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; border-radius: 24px; flex-direction: column; align-items: center; padding-top: 50px; z-index: 10; }
        .back-btn { position: absolute; top: 20px; left: 20px; background: none; border: none; font-size: 20px; cursor: pointer; color: #ccc; }
        .search-input { width: 80%; border: 1px solid #eee; padding: 12px; border-radius: 10px; font-size: 16px; outline: none; margin-bottom: 20px; }
        .loading-cloud { font-size: 40px; color: #eee; margin-top: 30px; }
    </style>
</head>
<body>

    <div class="widget-card">
        <div class="header">🕒 BOOK LOG</div>
        <div class="time" id="clock">00:00</div>
        <div class="date" id="date">MON, JAN 01</div>
        <button class="search-btn" onclick="openSearch()">🔍 search</button>

        <div id="search-overlay">
            <button class="back-btn" onclick="closeSearch()">←</button>
            <input type="text" class="search-input" id="bookTitle" placeholder="책 제목을 입력하세요...">
            <div class="loading-cloud">☁️</div>
            <div style="color: #999; font-size: 14px; margin-top: 10px;">Search...</div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}`;
            const options = { weekday: 'short', month: 'short', day: '2-digit' };
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', options).toUpperCase();
        }
        setInterval(updateClock, 1000);
        updateClock();

        function openSearch() { document.getElementById('search-overlay').style.display = 'flex'; }
        function closeSearch() { document.getElementById('search-overlay').style.display = 'none'; }
        
        document.getElementById('bookTitle').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                alert(this.value + ' 책을 노션에 저장합니다!');
                // 여기에 실제 노션 API 전송 로직이 들어갑니다.
                closeSearch();
                this.value = '';
            }
        });
    </script>
</body>
</html>
