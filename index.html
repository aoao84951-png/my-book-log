<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>리디북스 기록기</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f4f4; }
        .card { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #1f8ce6; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #1669ad; }
    </style>
</head>
<body>
    <div class="card">
        <h3>📚 리디북스 기록기</h3>
        <input type="text" id="bookUrl" placeholder="리디북스 주소를 붙여넣으세요">
        <button onclick="saveToNotion()">노션에 저장</button>
        <p id="status" style="font-size: 12px; color: #666; margin-top: 10px;"></p>
    </div>

    <script>
        async function saveToNotion() {
            const url = document.getElementById('bookUrl').value;
            const status = document.getElementById('status');
            if(!url) return alert('주소를 입력해주세요!');
            
            status.innerText = "저장 중...";
            // 실제 노션 저장 로직은 Vercel 서버 기능을 타야 하므로 우선 UI만 구현되었습니다.
            alert('설정 완료! 이제 Vercel에서 다시 Deploy를 눌러주세요.');
        }
    </script>
</body>
</html>
