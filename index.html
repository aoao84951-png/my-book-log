<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: transparent; font-family: sans-serif; }
        .card { width: 280px; height: 280px; background: white; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; }
        .search-input { width: 100%; border: 1px solid #ddd; padding: 8px; border-radius: 8px; outline: none; margin-bottom: 10px; }
        .res-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; }
        .res-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 12px; }
        .res-item img { width: 30px; height: 40px; border-radius: 2px; }
    </style>
</head>
<body>
    <div class="card">
        <input type="text" class="search-input" id="q" placeholder="책 제목 입력 후 엔터...">
        <ul id="list" class="res-list"></ul>
    </div>
    <script>
        document.getElementById('q').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const res = await fetch(`/api/search?query=${e.target.value}`);
                const books = await res.json();
                document.getElementById('list').innerHTML = books.map(b => 
                    `<li class="res-item" onclick="save('${b.title}','${b.author}','${b.cover}')">
                        <img src="${b.cover}"> <div><b>${b.title}</b><br>${b.author}</div>
                    </li>`).join('');
            }
        });
        async function save(t, a, c) {
            if(!confirm('저장할까요?')) return;
            const res = await fetch('/api/notion', { method: 'POST', body: JSON.stringify({title:t, author:a, cover:c}) });
            if(res.ok) alert('완료!'); else alert('실패!');
        }
    </script>
</body>
</html>
